<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>WebGL 3D Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body onload="init()">
    <canvas id="glcanvas" width="1000" height="600"></canvas>

    <!-- Vertex Shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">
      attribute vec3 aPosition;
      attribute vec2 aTexCoord;
      attribute vec3 aNormal;
      
      uniform mat4 uModelViewMatrix;
      uniform mat4 uProjectionMatrix;
      uniform mat4 uModelMatrix;
      
      varying vec2 vTexCoord;
      varying vec3 vNormal;
      varying vec3 vFragPos;
      
      void main() {
          vTexCoord = aTexCoord;
          vNormal = mat3(uModelMatrix) * aNormal;
          vFragPos = vec3(uModelMatrix * vec4(aPosition, 1.0));
          gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
      }
    </script>

    <!-- Fragment Shader -->
    <script id="fragment-shader" type="x-shader/x-fragment">
      precision mediump float;
      
      varying vec2 vTexCoord;
      varying vec3 vNormal;
      varying vec3 vFragPos;
      
      uniform sampler2D uSampler;
      uniform bool uUseSolidColor;
      uniform vec4 uSolidColor;
      
      uniform vec3 uLightPos;
      uniform vec3 uViewPos;
      uniform vec3 uLightColor;
      
      void main() {
          vec4 baseColor;
          if (uUseSolidColor) {
              baseColor = uSolidColor;
          } else {
              baseColor = texture2D(uSampler, vTexCoord);
          }
          
          vec3 norm = normalize(vNormal);
          
          // Ambient
          float ambientStrength = 0.3;
          vec3 ambient = ambientStrength * uLightColor;
          
          // Diffuse
          vec3 lightDir = normalize(uLightPos - vFragPos);
          float diff = max(dot(norm, lightDir), 0.0);
          vec3 diffuse = diff * uLightColor;
          
          // Specular
          float specularStrength = 0.5;
          vec3 viewDir = normalize(uViewPos - vFragPos);
          vec3 reflectDir = reflect(-lightDir, norm);
          float spec = pow(max(dot(viewDir, reflectDir), 0.0), 32.0);
          vec3 specular = specularStrength * spec * uLightColor;
          
          vec3 result = (ambient + diffuse + specular) * baseColor.rgb;
          gl_FragColor = vec4(result, baseColor.a);
      }
    </script>

    <script src="./math/Matrix.js"></script>
    <script src="./geometry/Geometry.js"></script>
    <script src="./geometry/MinecraftCharacter.js"></script>
    <script src="./texture/Texture.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
